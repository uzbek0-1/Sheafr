<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheafr</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --border: #222222;
            --accent: #c8f135;
            --accent-dim: #8aaa1f;
            --text: #e8e8e8;
            --text-muted: #555555;
            --danger: #ff4444;
            --mono: 'Space Mono', monospace;
            --display: 'Syne', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(200, 241, 53, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200, 241, 53, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            margin-bottom: 40px;
            animation: fadeDown 0.6s ease forwards;
        }

        .logo {
            font-family: var(--display);
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -2px;
            color: var(--text);
            line-height: 1;
        }

        .logo span {
            color: var(--accent);
        }

        .tagline {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        /* Status bar */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Panel */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 28px;
            position: relative;
            animation: fadeUp 0.5s ease forwards;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent);
        }

        .panel-label {
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* Inputs */
        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--mono);
            font-size: 14px;
            padding: 12px 14px;
            outline: none;
            transition: border-color 0.2s;
            letter-spacing: 1px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--accent);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 13px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
            font-weight: 700;
        }

        .btn-action {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 12px;
            cursor: pointer;
            border: none;
            font-weight: 700;
            transition: all 0.15s;
        }

        .btn-action.leave {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .btn-action.leave:hover {
            border-color:var(--text-muted);
            color: var(--text);
        }

        .btn-action.burn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .btn-action.burn:hover {
            background: var(--danger);
            color: #0a0a0a;
        }

        .btn-primary {
            background: var(--accent);
            color: #0a0a0a;
        }

        .btn-primary:hover {
            background: #d4f84a;
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            margin-top: 10px;
        }

        .btn-ghost:hover {
            border-color: var(--text-muted);
            color: var(--text);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* PIN display */
        .pin-display {
            background: var(--bg);
            border: 1px solid var(--accent);
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .pin-display-label {
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-dim);
            margin-bottom: 10px;
        }

        .pin-value {
            font-family: var(--display);
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 8px;
            color: var(--accent);
        }

        .pin-warning {
            font-size: 9px;
            color: var(--text-muted);
            margin-top: 8px;
            letter-spacing: 1px;
        }

        /* Chat interface */
        #chat {
            display: none;
            animation: fadeUp 0.4s ease forwards;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom: none;
            position: relative;
        }

        .chat-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent);
        }

        .chat-pin-badge {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-pin-label {
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .chat-pin-value {
            font-family: var(--display);
            font-size: 16px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 3px;
        }

        .burn-timer {
            font-size: 9px;
            color: var(--text-muted);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .burn-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--danger);
            animation: pulse 1.5s infinite;
        }

        /* Messages */
        #messages {
            background: var(--bg);
            border: 1px solid var(--border);
            border-bottom: none;
            height: 340px;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #messages::-webkit-scrollbar {
            width: 3px;
        }

        #messages::-webkit-scrollbar-track {
            background: var(--bg);
        }

        #messages::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        .message {
            padding: 10px 14px;
            background: var(--surface);
            border-left: 2px solid var(--border);
            animation: fadeUp 0.2s ease forwards;
            max-width: 90%;
        }

        .message.own {
            border-left-color: var(--accent);
            align-self: flex-end;
        }

        .message-sender {
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .message.own .message-sender {
            color: var(--accent-dim);
        }

        .message-text {
            font-size: 13px;
            line-height: 1.5;
            color: var(--text);
            word-break: break-word;
        }

        .system-message {
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
            padding: 4px 0;
        }

        /* Input area */
        .chat-input-area {
            display: flex;
            border: 1px solid var(--border);
            background: var(--surface);
        }

        .chat-input-area input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 14px 16px;
        }

        .send-btn {
            background: var(--accent);
            border: none;
            padding: 0 20px;
            cursor: pointer;
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #0a0a0a;
            transition: background 0.15s;
            white-space: nowrap;
        }

        .send-btn:hover {
            background: #d4f84a;
        }

        /* Footer */
        .footer {
            margin-top: 24px;
            font-size: 9px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--surface);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 10px 20px;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Mobile */
        @media (max-width: 500px) {
            .logo { font-size: 32px; }
            .pin-value { font-size: 30px; letter-spacing: 6px; }
            #messages { height: 280px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">Shea<span>fr</span></div>
        <div class="tagline">End-to-end encrypted · Ephemeral · No accounts</div>
        <div class="status-bar">
            <div class="status-dot"></div>
            <span>E2E ENCRYPTED — AES-256-GCM</span>
        </div>
    </div>

    <!-- Setup Panel -->
    <div id="setup">
        <div class="panel">
            <div class="panel-label">// Identity</div>
            <div class="input-group">
                <label class="input-label">Display name</label>
                <input type="text" id="usernameInput" placeholder="Anonymous" maxlength="20" />
            </div>

            <div class="divider">Session</div>

            <button class="btn btn-primary" onclick="createRoom()">Create New Room</button>

            <div class="divider">or join existing</div>

            <div class="input-group">
                <label class="input-label">Room PIN</label>
                <input type="text" id="pinInput" placeholder="000000" maxlength="6"
                    oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                    onkeydown="if(event.key==='Enter') joinRoom()" />
            </div>
            <button class="btn btn-ghost" onclick="joinRoom()">Join Room →</button>
        </div>

        <div class="footer">Messages burn after 24 hours · Server sees only ciphertext</div>
    </div>

    <!-- Chat Panel -->
    <div id="chat">
        <div class="chat-header">
            <div class="chat-pin-badge">
                <span class="chat-pin-label">PIN</span>
                <span class="chat-pin-value" id="currentPin"></span>
            </div>
            <div style="display:flex; gap:8px; align-items: center;">
            <div class="burn-timer">
                <div class="burn-dot"></div>
                <span>BURNS IN <span id="burnTimer">24:00:00</span></span>
            </div>
            <button class="btn-action leave" onclick="leaveRoom()">Leave</button>
            <button class="btn-action burn" onclick="burnAndLeave()">Burn</button>
        </div>
        </div>

        <div id="messages"></div>

        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Type a message..."
                onkeydown="if(event.key==='Enter') sendMessage()" />
            <button class="send-btn" onclick="sendMessage()">Send ↑</button>
        </div>

        <div class="footer" style="margin-top:14px">
            All messages encrypted client-side · <span style="color:var(--accent)">Room PIN: <span id="footerPin"></span></span>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const BASE_URL = window.location.origin;
    const WS_BASE = BASE_URL.replace(/^http/, 'ws');

    let ws, username, encryptionKey, roomCreatedAt;
    let burnInterval;

    function leaveRoom() {
    if (ws) ws.close();
    clearInterval(burnInterval);
    document.getElementById("chat").style.display = "none";
    document.getElementById("setup").style.display = "block";
    document.getElementById("messages").innerHTML = "";
    showToast("Left the room");
}

async function burnAndLeave() {
    try {
        await fetch(`${BASE_URL}/burn/${document.getElementById("currentPin").textContent}?username=${encodeURIComponent(username)}`, {
            method: "DELETE"
        });
    } catch(e) {}
    leaveRoom();
    showToast("Messages burned · Left the room");
}

    function showToast(msg, duration = 3000) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), duration);
    }

    async function deriveKey(pin) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
            "raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]
        );
        return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: enc.encode("sheafr-v1"), iterations: 100000, hash: "SHA-256" },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"]
        );
    }

    async function encryptMessage(key, message) {
        const enc = new TextEncoder();
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encrypted = await crypto.subtle.encrypt(
            { name: "AES-GCM", iv },
            key,
            enc.encode(message)
        );
        return JSON.stringify({
            iv: Array.from(iv),
            data: Array.from(new Uint8Array(encrypted))
        });
    }

    async function decryptMessage(key, payload) {
        const { iv, data } = JSON.parse(payload);
        const decrypted = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: new Uint8Array(iv) },
            key,
            new Uint8Array(data)
        );
        return new TextDecoder().decode(decrypted);
    }

    async function createRoom() {
        username = document.getElementById("usernameInput").value.trim() || "Anonymous";
        try {
            const res = await fetch(`${BASE_URL}/create-room`, { method: "POST" });
            const data = await res.json();
            showToast(`Room created — PIN: ${data.pin}`);
            connectWS(data.pin);
        } catch (e) {
            showToast("Connection failed. Is the server running?");
        }
    }

    async function joinRoom() {
    username = document.getElementById("usernameInput").value.trim() || "Anonymous";
    const pin = document.getElementById("pinInput").value.trim();
    if (pin.length !== 6) { showToast("PIN must be 6 digits"); return; }
    const res = await fetch(`${BASE_URL}/join-room/${pin}`);
    const data = await res.json();
    if (data.message === "Room found") {
        const elapsedMs = (data.elapsed_seconds || 0) * 1000;
        connectWS(pin, elapsedMs);
    } else {
        showToast("Room not found or expired");
    }
    }

    async function connectWS(pin , elapsedMs = 0) {
        encryptionKey = await deriveKey(pin);
        roomCreatedAt = Date.now() - elapsedMs;

        document.getElementById("currentPin").textContent = pin;
        document.getElementById("footerPin").textContent = pin;
        document.getElementById("setup").style.display = "none";
        document.getElementById("chat").style.display = "block";

        startBurnTimer();
        addSystemMessage("Connected · Messages are end-to-end encrypted");

        ws = new WebSocket(`${WS_BASE}/ws/${pin}`);

        ws.onmessage = async (event) => {
            try {
                if (event.data.startsWith("__SYSTEM__:")) {
                    const info = event.data.replace("__SYSTEM__:","");
                    addSystemMessage(info);
                    return;
                }
                if (event.data.startsWith("__BURN__:")) {
                    const burnedUser = event.data.replace("__BURN__:", "");
                    document.querySelectorAll(".message").forEach(el => {
                        const sender = el.querySelector(".message-sender")?.textContent;
                        if (sender === burnedUser) el.remove();
                    });
                    addSystemMessage(`${burnedUser} burned their messages`);
                    return;
                }
                const decrypted = await decryptMessage(encryptionKey, event.data);
                const colonIdx = decrypted.indexOf(': ');
                const sender = colonIdx > -1 ? decrypted.substring(0, colonIdx) : '';
                const text = colonIdx > -1 ? decrypted.substring(colonIdx + 2) : decrypted;
                const isOwn = sender === username;
                addMessage(sender, text, isOwn);
            } catch (e) {
                addSystemMessage("Could not decrypt a message");
            }
        };

        ws.onclose = () => {
            addSystemMessage("Disconnected from room");
        };

        ws.onerror = () => {
            addSystemMessage("Connection error");
        };
    }

    function addMessage(sender, text, isOwn) {
        const messages = document.getElementById("messages");
        const div = document.createElement("div");
        div.className = `message${isOwn ? ' own' : ''}`;
        div.innerHTML = `
            <div class="message-sender">${escapeHtml(sender)}</div>
            <div class="message-text">${escapeHtml(text)}</div>
        `;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function addSystemMessage(text) {
        const messages = document.getElementById("messages");
        const div = document.createElement("div");
        div.className = "system-message";
        div.textContent = `— ${text} —`;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById("messageInput");
        const text = input.value.trim();
        if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
        const encrypted = await encryptMessage(encryptionKey, username + ': ' + text);
        ws.send(encrypted);
        input.value = "";
    }

    function startBurnTimer() {
        const burnEl = document.getElementById("burnTimer");
        const BURN_MS = 24 * 60 * 60 * 1000;
        burnInterval = setInterval(() => {
            const elapsed = Date.now() - roomCreatedAt;
            const remaining = Math.max(0, BURN_MS - elapsed);
            const h = Math.floor(remaining / 3600000);
            const m = Math.floor((remaining % 3600000) / 60000);
            const s = Math.floor((remaining % 60000) / 1000);
            burnEl.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            if (remaining === 0) clearInterval(burnInterval);
        }, 1000);
    }

    function escapeHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
</script>
</body>
</html>
